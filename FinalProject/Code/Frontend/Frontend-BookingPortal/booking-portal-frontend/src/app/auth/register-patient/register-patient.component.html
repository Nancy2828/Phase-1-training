<div class="register-container">
  <h2 class="text-primary mb-4">Register Patient</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="card p-4 shadow-sm rounded-4">

    <!-- Username -->
    <div class="mb-3">
      <input type="text" formControlName="username" placeholder="Username" class="form-control" />
      <div *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched" class="text-danger mt-1">
        <small *ngIf="registerForm.get('username')?.errors?.['required']">Username is required</small>
        <small *ngIf="registerForm.get('username')?.errors?.['minlength']">Minimum 3 characters</small>
        <small *ngIf="registerForm.get('username')?.errors?.['maxlength']">Maximum 25 characters</small>
      </div>
    </div>

    <!-- Password -->
    <div class="mb-3">
      <input type="password" formControlName="password" placeholder="Password" class="form-control" />
      <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="text-danger mt-1">
        <small *ngIf="registerForm.get('password')?.errors?.['required']">Password is required</small>
        <small *ngIf="registerForm.get('password')?.errors?.['minlength']">Minimum 8 characters</small>
        <small *ngIf="registerForm.get('password')?.errors?.['pattern']">
          Must include uppercase, lowercase, number & special character
        </small>
      </div>
    </div>

    <!-- Age -->
    <div class="mb-3">
      <input type="number" formControlName="age" placeholder="Age" class="form-control" />
      <div *ngIf="registerForm.get('age')?.invalid && registerForm.get('age')?.touched" class="text-danger mt-1">
        <small *ngIf="registerForm.get('age')?.errors?.['required']">Age is required</small>
        <small *ngIf="registerForm.get('age')?.errors?.['min']">Minimum age is 1</small>
        <small *ngIf="registerForm.get('age')?.errors?.['max']">Maximum age is 120</small>
      </div>
    </div>

    <!-- Gender -->
    <div class="mb-3">
      <select formControlName="gender" class="form-select">
        <option value="" disabled>Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
      <div *ngIf="registerForm.get('gender')?.invalid && registerForm.get('gender')?.touched" class="text-danger mt-1">
        <small>Gender is required</small>
      </div>
    </div>

    <!-- Medical History -->
    <div class="mb-3">
      <textarea formControlName="medicalHistory" placeholder="Medical History (optional)" class="form-control" rows="3"></textarea>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn btn-primary w-100">Register</button>

    <!-- Success / Error Messages -->
    <div *ngIf="success" class="alert alert-success mt-3">{{ success }}</div>
    <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>

  </form>
</div>
